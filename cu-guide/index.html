<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C:U 상태이상 응급 매뉴얼</title>
  <meta name="description" content="Casualties: Unknown 상태이상(출혈, 골절 등)을 골라 담으면 무엇부터 어떻게 치료할지 순서대로 알려주는 비공식 팬 가이드.">

  <!-- 오픈그래프: 카카오톡·디스코드·페이스북 등에 링크를 붙였을 때 보이는 미리보기 -->
  <!-- 주소(omgilost.vercel.app)가 바뀌면 아래 og:url, og:image, twitter:image 세 곳을 같이 고친다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="C:U 상태이상 응급 매뉴얼">
  <meta property="og:title" content="C:U 상태이상 응급 매뉴얼">
  <meta property="og:description" content="걸린 상태이상을 고르면 무엇부터 치료할지 바로 알려줍니다. Casualties: Unknown 비공식 팬 가이드.">
  <meta property="og:url" content="https://omgilost.vercel.app/">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://omgilost.vercel.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="C:U 상태이상 응급 매뉴얼 - 출혈은 붕대 감기, 골절은 부목 대기 순서로 치료">

  <!-- 트위터(X) 카드 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="C:U 상태이상 응급 매뉴얼">
  <meta name="twitter:description" content="걸린 상태이상을 고르면 무엇부터 치료할지 바로 알려줍니다.">
  <meta name="twitter:image" content="https://omgilost.vercel.app/og-image.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <!-- 메인 화면 (찾기) -->
    <section id="view-main" class="view">
      <header class="app-header">
        <h1>C:U 상태이상 응급 매뉴얼</h1>
        <p class="sub">Casualties: Unknown</p>
      </header>
      <input id="search" class="search" type="search"
             placeholder="이름(한/영) 또는 증상으로 검색" autocomplete="off">
      <p class="guide">지금 걸린 상태이상을 눌러서 선택하면 치료 순서가 바로 나옵니다.</p>
      <div id="quick-order" class="quick-order" hidden></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
    </section>

    <!-- 상세 화면 -->
    <section id="view-detail" class="view" hidden>
      <button class="back" data-back>← 돌아가기</button>
      <div id="detail"></div>
    </section>

    <!-- 치료 순서 화면 -->
    <section id="view-order" class="view" hidden>
      <button class="back" data-back>← 돌아가기</button>
      <h2>치료 순서</h2>
      <ol id="order" class="order"></ol>
    </section>

    <footer class="source">
      참고: Scav Prototype Wiki (scavprototype.wiki.gg) · 비공식 팬 가이드
    </footer>
  </div>

  <!-- 하단 고정 바 -->
  <div id="bar" class="bar" hidden>
    <button id="bar-open" class="bar-open"></button>
    <button id="bar-clear" class="bar-clear">전체 해제</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
